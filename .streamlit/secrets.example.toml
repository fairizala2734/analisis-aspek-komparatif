# Salin file ini menjadi .streamlit/secrets.toml.
# Jangan commit secrets.toml karena berisi API key pribadi.

[llm]
base_url = "https://openrouter.ai/api/v1"
api_key = "ISI_OPENROUTER_API_KEY_DI_SINI"
model = "openai/gpt-oss-120b:free"
temperature = 0.0
max_tokens = 4000
use_json_mode = false
always_retry_per_call = true
retry_base_sleep = 4.0
retry_max_sleep = 30.0

[openrouter]
http_referer = "http://localhost:8501"
app_title = "Analisis Aspek Komparatif"

[app]
local_results_dir = "local_results"
